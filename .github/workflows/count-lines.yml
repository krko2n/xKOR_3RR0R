name: Count Lines of Code

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get install -y cloc

      - name: Count lines (markdown)
        run: |
          cloc . \
            --exclude-dir=node_modules,.git,dist,build \
            --exclude-ext=json,lock \
            --md \
            --out=LINES.md

      - name: Generate badges
        run: |
          cloc . \
            --exclude-dir=node_modules,.git,dist,build \
            --exclude-ext=json,lock \
            --json \
            --quiet > cloc_output.json

          CODE=$(jq '.SUM.code' cloc_output.json)
          FILES=$(jq '.SUM.nFiles' cloc_output.json)

          mkdir -p badges

          cat > badges/counts.json <<EOF
          {
              "label":  "lines",
              "message":  "$CODE",
              "schemaVersion":  1,
              "color":  "ED6BFB"
          }
          EOF

          cat > badges/files.json <<EOF
          {
              "label":  "files",
              "message":  "$FILES",
              "schemaVersion":  1,
              "color":  "4603A1"
          }
          EOF

          # Update static badge URLs in README (no shields.io caching)
          sed -i "s|badge/lines-[0-9]*-|badge/lines-$CODE-|" README.md
          sed -i "s|badge/files-[0-9]*-|badge/files-$FILES-|" README.md

          rm -f cloc_output.json

      - name: Commit LINES.md + badges + README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LINES.md badges/counts.json badges/files.json README.md
          git diff --cached --quiet || git commit -m "chore: update line count and badges [skip ci]"
          git push