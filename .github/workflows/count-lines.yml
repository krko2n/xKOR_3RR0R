name: Count Lines of Code

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get install -y cloc

      - name: Count lines
        run: |
          cloc . \
            --exclude-dir=node_modules,.git,dist,build \
            --exclude-ext=json,lock \
            --md \
            --out=LINES.md

      - name: Commit LINES.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LINES.md
          git diff --cached --quiet || git commit -m "chore: update line count [skip ci]"
          git push