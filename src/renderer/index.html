<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>xKOR_3RR0R</title>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:* ws://localhost:*; img-src 'self' data: blob:;">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/boot.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/ai.css">
    <link rel="stylesheet" href="css/filemanager.css">
    <link rel="stylesheet" href="css/keyboard.css">
    <link rel="stylesheet" href="css/graphs.css">
    <link rel="stylesheet" href="css/globe.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <div id="login-overlay"><div class="login-box"><div class="login-title">xKOR_3RR0R</div><div class="login-subtitle">SYSTEM ACCESS REQUIRED</div><div class="login-field"><label for="login-user">USERNAME</label><input type="text" id="login-user" autocomplete="off"></div><div class="login-field"><label for="login-pass">PASSWORD</label><input type="password" id="login-pass"></div><button id="login-btn">AUTHENTICATE</button><div id="login-error"></div></div></div>

<!-- ========================= -->
<!-- LOGIN SCREEN              -->
<!-- ========================= -->
<div id="login-screen">
    <div id="login-noise"></div>
    <div id="login-box">
        <div id="login-logo">xKOR_3RR0R</div>
        <div id="login-subtitle">SECURE TERMINAL INTERFACE</div>
        <div id="login-version">v1.0.0 &nbsp;·&nbsp; AUTHENTICATED ACCESS ONLY</div>
        <div id="login-divider"></div>
        <div class="login-field">
            <label>USER IDENTIFIER</label>
            <input type="text" id="login-user" autocomplete="off" spellcheck="false" placeholder="——————">
        </div>
        <div class="login-field">
            <label>ACCESS KEY</label>
            <input type="password" id="login-pass" autocomplete="off" placeholder="——————">
        </div>
        <button id="login-btn">[ AUTHENTICATE ]</button>
        <div id="login-status"></div>
    </div>
</div>

<!-- ========================= -->
<!-- BOOT SCREEN -->
<!-- ========================= -->
<div id="boot-screen">
    <div id="boot-logo">xKOR_3RR0R</div>
    <div id="boot-log"></div>
    <div id="boot-progress"><div id="boot-bar"></div></div>
</div>

<!-- ========================= -->
<!-- MAIN UI -->
<!-- ========================= -->
<div id="app" style="display:none;">

    <!-- TOP BAR -->
    <div id="top-bar">
        <div class="tab active" data-tab="term1">TERMINAL 1</div>
        <div class="tab" data-tab="term2">TERMINAL 2</div>
        <div class="tab" data-tab="term3">TERMINAL 3</div>
        <div class="tab" data-tab="web">WEB</div>
        <div class="tab" id="ai-toggle">AI PANEL (F2)</div>
    </div>

    <!-- MAIN LAYOUT -->
    <div id="layout">

        <!-- LEFT PANEL -->
        <div id="left-panel">
            <canvas id="globe"></canvas>
            <canvas id="cpu-graph"></canvas>
            <canvas id="ram-graph"></canvas>
            <canvas id="net-graph"></canvas>
            <canvas id="temp-graph"></canvas>
        </div>

        <!-- MAIN TERMINAL AREA -->
        <div id="main-panel">
            <div class="terminal" id="term1"></div>
            <div class="terminal" id="term2" style="display:none;"></div>
            <div class="terminal" id="term3" style="display:none;"></div>

            <div id="web-panel" style="display:none;">
                <div id="web-output"></div>
            </div>
        </div>

        <!-- RIGHT AI PANEL -->
        <div id="ai-panel">
            <div id="ai-messages"></div>
            <input id="ai-input" placeholder="Ask AI..." />
        </div>

    </div>

    <!-- BOTTOM: FILE MANAGER + KEYBOARD -->
    <div id="bottom">
        <div id="filemanager"></div>
        <div id="keyboard"></div>
    </div>

</div>

<script src="js/login.js"></script>
<script src="js/boot.js"></script>
<script src="js/ui.js"></script>
<script src="js/tabs.js"></script>
<script src="js/terminal.js"></script>
<script src="js/ai.js"></script>
<script src="js/filemanager.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/graphs.js"></script>
<script src="js/globe.js"></script>

</body>
</html>
