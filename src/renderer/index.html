<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>xKOR_3RR0R</title>

    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; connect-src ws://localhost:*; script-src 'self'; style-src 'self' 'unsafe-inline';">

    <link rel="stylesheet" href="css/boot.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/ai.css">
    <link rel="stylesheet" href="css/filemanager.css">
    <link rel="stylesheet" href="css/keyboard.css">
    <link rel="stylesheet" href="css/graphs.css">
    <link rel="stylesheet" href="css/globe.css">
</head>

<body>

<!-- ========================= -->
<!-- BOOT SCREEN -->
<!-- ========================= -->
<div id="boot-screen">
    <div id="boot-logo">xKOR_3RR0R</div>
    <div id="boot-log"></div>
    <div id="boot-progress"><div id="boot-bar"></div></div>
</div>

<!-- ========================= -->
<!-- MAIN UI -->
<!-- ========================= -->
<div id="app" style="display:none;">

    <!-- TOP BAR -->
    <div id="top-bar">
        <div class="tab active" data-tab="term1">TERMINAL 1</div>
        <div class="tab" data-tab="term2">TERMINAL 2</div>
        <div class="tab" data-tab="term3">TERMINAL 3</div>
        <div class="tab" data-tab="web">WEB</div>
        <div class="tab" id="ai-toggle">AI PANEL (F2)</div>
    </div>

    <!-- MAIN LAYOUT -->
    <div id="layout">

        <!-- LEFT PANEL -->
        <div id="left-panel">
            <canvas id="globe"></canvas>
            <canvas id="cpu-graph"></canvas>
            <canvas id="ram-graph"></canvas>
            <canvas id="net-graph"></canvas>
            <canvas id="temp-graph"></canvas>
        </div>

        <!-- MAIN TERMINAL AREA -->
        <div id="main-panel">
            <div class="terminal" id="term1"></div>
            <div class="terminal" id="term2" style="display:none;"></div>
            <div class="terminal" id="term3" style="display:none;"></div>

            <div id="web-panel" style="display:none;">
                <div id="web-output"></div>
            </div>
        </div>

        <!-- RIGHT AI PANEL -->
        <div id="ai-panel">
            <div id="ai-messages"></div>
            <input id="ai-input" placeholder="Ask AI..." />
        </div>

    </div>

    <!-- BOTTOM: FILE MANAGER + KEYBOARD -->
    <div id="bottom">
        <div id="filemanager"></div>
        <div id="keyboard"></div>
    </div>

</div>

<script src="js/boot.js"></script>
<script src="js/ui.js"></script>
<script src="js/tabs.js"></script>
<script src="js/terminal.js"></script>
<script src="js/ai.js"></script>
<script src="js/filemanager.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/graphs.js"></script>
<script src="js/globe.js"></script>

</body>
</html>
