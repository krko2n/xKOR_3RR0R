# settings.yaml - Odlehcena konfigurace pro prostredi xKOR_3RR0R
infrastructure:
  kubeconfig: "~/.kube/config"
  prometheus_url: "http://prom:9090"
  platform: "kubernetes"
discovery:
  namespaces:
    include: ["robot-shop", "prod-.*"]
    exclude: ["kube-system"]
  labels:
    pod_selector: "tier=backend"
    node_selector: "role=worker"
evolution:
  generations: 10
  population_size: 20
  mutation_rate: 0.1
  fitness_strategy: "range-based"
slos:
  - metric: "http_latency"
    threshold: "500ms"
    weight: 1.0
  - metric: "error_rate"
    threshold: "1%"
    weight: 2.0